<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{7*7}}</title>
<title>{{7*7}}</title>
<style>
  :root {
    --bg: #0a0e14;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --border: #1f2630;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 520px;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    background: linear-gradient(180deg, #0d1117, #0a0e14);
  }
  .tag {
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 28px;
    margin: 8px 0 4px;
    word-break: break-all;
  }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { text-align: right; word-break: break-all; }
  .footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <main class="card">
    <div class="tag">Proof of Concept</div>
    <h1>19whoami19</h1>
    <div class="sub">Security research marker page</div>

    <div class="row"><span>Handle</span><span>19whoami19</span></div>
    <div class="row"><span>Platform</span><span>Cybervuln</span></div>
    <div class="row"><span>Loaded at</span><span id="ts">—</span></div>
    <div class="row"><span>Origin</span><span id="origin">—</span></div>
    <div class="row"><span>Referrer</span><span id="ref">—</span></div>

    <div class="footer">This page is hosted for authorized security testing only.</div>
  </main>

  <script>
    document.getElementById('ts').textContent = new Date().toISOString();
    document.getElementById('origin').textContent = location.origin || '—';
    document.getElementById('ref').textContent = document.referrer || 'none';
  </script>
</body>
</html>
